[package]
name = "raycast-dictation-clone"
version = "0.1.0"
edition = "2024"
default-run = "raycast-dictation-clone"

[dependencies]
arboard = "3.6"
cpal = "0.15"
enigo = "0.6"
global-hotkey = "0.8"
hound = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "=1.13.5"
sherpa-onnx-sys = "=1.13.5"
sysinfo = "0.39"
ureq = "2"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "424a68244aa9b8ac9d4766e51b0824d2b2174bd7" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "424a68244aa9b8ac9d4766e51b0824d2b2174bd7", features = ["font-kit"] }
